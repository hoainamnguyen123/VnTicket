server:
  port: ${PORT:8080}

spring:
  application:
    name: vnticket-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10        # Tăng từ 5 → 10 (Neon free cho phép ~20 connections)
      minimum-idle: 3              # Tăng từ 2 → 3
      connection-timeout: 5000     # Fail nhanh 5s thay vì chờ 30s mặc định
      max-lifetime: 600000         # 10 phút — phù hợp với Neon free (có idle timeout)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:true}
      jedis:
        pool:
          max-active: 10           # Tăng từ 5 → 10
          max-idle: 5              # Tăng từ 3 → 5
          min-idle: 2              # Tăng từ 1 → 2
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: true
    listener:
      simple:
        concurrency: ${RABBITMQ_CONCURRENCY:2}
        max-concurrency: ${RABBITMQ_MAX_CONCURRENCY:8}
        prefetch: ${RABBITMQ_PREFETCH:5}
    cache:
      channel:
        size: ${RABBITMQ_CHANNEL_CACHE_SIZE:25}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  resend:
    api-key: ${RESEND_API_KEY}
  jwt:
    secret: ${JWT_SECRET}
    expirationMs: 900000
    jwtRefreshExpirationMs: 864000000
  google:
    clientId: ${GOOGLE_CLIENT_ID}
  vnpay:
    tmnCode: ${VNPAY_TMN_CODE}
    hashSecret: ${VNPAY_HASH_SECRET}
    payUrl: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    returnUrl: ${VNPAY_RETURN_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookie:
    secure: true
    sameSite: None
    max-age-seconds: 864000
  reservation:
    ttlMinutes: 15
  booking:
    single-pending-per-event: ${SINGLE_PENDING_PER_EVENT:true}
  inventory:
    retention-hours-after-event: 24
  rate-limit:
    global-per-second: ${GLOBAL_RATE_LIMIT_PER_SECOND:2000}
    per-ip-per-second: ${IP_RATE_LIMIT_PER_SECOND:100}
    cleanup-interval-ms: 600000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

resilience4j:
  circuitbreaker:
    instances:
      redisInventory:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
